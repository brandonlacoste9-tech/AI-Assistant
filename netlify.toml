# RendezVous AI — Netlify deploy config
# Docs: docs/NETLIFY_DEPLOY.md

[build]
  base = "web"
  command = "npm run build"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--legacy-peer-deps"
  NEXT_PUBLIC_SUPABASE_URL = "https://ulbfaxhsbbckotcbmslk.supabase.co"
  NEXT_PUBLIC_SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVsYmZheGhzYmJja290Y2Jtc2xrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYyOTc0MzksImV4cCI6MjA5MTg3MzQzOX0.8gw_5O7cK5ZQEdM5E8F0E4hFqB-bPtOGA0mB2u-LV18"
  NEXT_PUBLIC_SITE_URL = "https://resilient-khapse-ecd31c.netlify.app"

# Next.js App Router API routes + SSR
[functions]
  node_bundler = "esbuild"

# Security headers (marketing site)
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache static assets
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"